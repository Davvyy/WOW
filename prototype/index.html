<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챌로리 프로토타입</title>
<meta name="description" content="다이어트 챌린지 앱 챌로리(Challory) 참가자 화면 P1~P12 클릭 프로토타입 — docs/06-화면-설계.md 기준">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Layout concept: 검수 패널(좌) + 390×844 폰 프레임(중앙) + 화면 노트(우).
   폰 안쪽 토큰은 docs/06 §5.1 그대로. 숫자는 Barlow Semi Condensed(스코어보드), 본문은 IBM Plex Sans KR.
   ========================================================= */
:root {
  /* 폰 내부 토큰 — 라이트 (06 §5.1) */
  --bg: #FFFFFF; --surface: #F4F6F8; --fg: #1A1C1E; --fg-2: #4A4F55;
  --border: #DDE1E6; --border-strong: #808992;
  --brand: #0B6E70; --on-brand: #FFFFFF; --brand-soft: #DCF1F1;
  --good: #176F33; --good-soft: #E3F5E8;
  --warn: #8A5A00; --warn-soft: #FFF1D6;
  --critical: #B3261E; --critical-soft: #FBE4E2;
  --review: #5B4FCF; --review-soft: #ECEAFB;
  --ring-track: var(--border-strong);
  --intake: #DC6420; --burn: #0B9EA9;         /* 섭취/소비 데이터 색 (dataviz 검증 통과) */
  --kakao: #FEE500; --on-kakao: #191919; --apple: #000000; --on-apple: #FFFFFF;
  /* 검수 패널(프레임 밖) */
  --h-bg: #E6EBEC; --h-fg: #1A1C1E; --h-fg-2: #4F5A5E; --h-surface: #FFFFFF; --h-border: #CBD3D6; --h-accent: #0B6E70;
  --bezel: #121417;
  --font-body: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-num: 'Barlow Semi Condensed', 'IBM Plex Sans KR', system-ui, sans-serif;
  --zoom: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1C1F24; --fg: #E6E8EB; --fg-2: #A3A9B1;
    --border: #2A2F36; --border-strong: #6A727C;
    --brand: #5FD3D5; --on-brand: #0B1F20; --brand-soft: #163F40;
    --good: #6CCB84; --good-soft: #1B3A25;
    --warn: #F2B84B; --warn-soft: #3D2E0F;
    --critical: #FF8A80; --critical-soft: #4A1A17;
    --review: #B4ACFF; --review-soft: #272352;
    --intake: #DD7434; --burn: #1F9EA8;
    --h-bg: #0B0F10; --h-fg: #E6E8EB; --h-fg-2: #A3A9B1; --h-surface: #15191C; --h-border: #2A3237; --h-accent: #5FD3D5;
    --bezel: #2A2F36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1C1F24; --fg: #E6E8EB; --fg-2: #A3A9B1;
  --border: #2A2F36; --border-strong: #6A727C;
  --brand: #5FD3D5; --on-brand: #0B1F20; --brand-soft: #163F40;
  --good: #6CCB84; --good-soft: #1B3A25;
  --warn: #F2B84B; --warn-soft: #3D2E0F;
  --critical: #FF8A80; --critical-soft: #4A1A17;
  --review: #B4ACFF; --review-soft: #272352;
  --intake: #DD7434; --burn: #1F9EA8;
  --h-bg: #0B0F10; --h-fg: #E6E8EB; --h-fg-2: #A3A9B1; --h-surface: #15191C; --h-border: #2A3237; --h-accent: #5FD3D5;
  --bezel: #2A2F36;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--h-bg); color: var(--h-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; flex: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.sm { font-size: 18px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
.ms.sm.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
.ms.xs { font-size: 14px; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.ms.xs.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- 검수 패널 레이아웃 ---------- */
.harness { display: grid; grid-template-columns: 252px minmax(0, 1fr) 300px; min-height: 100%; }
.panel { background: var(--h-surface); border-right: 1px solid var(--h-border); padding: 16px 14px 24px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.panel h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
.panel h1 .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--h-accent); color: #fff; display: inline-grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.panel .sub { color: var(--h-fg-2); font-size: 12px; margin: -6px 0 0 34px; }
.panel .sec { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--h-fg-2); font-weight: 600; margin: 4px 0 -6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: grid; grid-template-columns: 34px 1fr; align-items: center; text-align: left; gap: 6px; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--h-fg); font-size: 13px; }
.nav button .id { font-family: var(--font-num); font-weight: 600; color: var(--h-fg-2); font-size: 12px; }
.nav button:hover { background: var(--h-bg); }
.nav button[aria-current="true"] { background: var(--h-accent); color: #fff; }
.nav button[aria-current="true"] .id { color: rgba(255,255,255,.8); }
.variants { display: flex; flex-wrap: wrap; gap: 6px; }
.variants button { border: 1px solid var(--h-border); background: var(--h-surface); color: var(--h-fg); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.variants button[aria-pressed="true"] { background: var(--h-fg); color: var(--h-surface); border-color: var(--h-fg); }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; }
.ctrl button { border: 1px solid var(--h-border); background: var(--h-surface); color: var(--h-fg); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.ctrl button[aria-pressed="true"] { border-color: var(--h-accent); color: var(--h-accent); font-weight: 600; }
.stage { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 28px 16px 40px; gap: 14px; min-width: 0; }
.stage .crumbs { color: var(--h-fg-2); font-size: 12px; display: flex; gap: 8px; align-items: center; }
.stage .crumbs b { color: var(--h-fg); font-weight: 600; }
.notes { padding: 24px 18px; border-left: 1px solid var(--h-border); background: var(--h-surface); position: sticky; top: 0; height: 100vh; overflow: auto; font-size: 13px; color: var(--h-fg-2); }
.notes h2 { font-size: 14px; color: var(--h-fg); margin: 0 0 6px; }
.notes h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 6px; color: var(--h-fg-2); }
.notes p { margin: 0 0 8px; }
.notes ul { margin: 0; padding-left: 16px; }
.notes li { margin-bottom: 4px; }
.notes code { background: var(--h-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.notes a { color: var(--h-accent); }
.mobilebar { display: none; }
@media (max-width: 1100px) { .harness { grid-template-columns: 232px minmax(0, 1fr); } .notes { display: none; } }
@media (max-width: 760px) {
  .harness { display: block; }
  .panel { display: none; }
  .mobilebar { display: flex; gap: 8px; padding: 10px 16px; background: var(--h-surface); border-bottom: 1px solid var(--h-border); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; flex-wrap: wrap; align-items: center; }
  .mobilebar select { flex: 1 1 120px; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--h-border); background: var(--h-surface); }
  .mobilebar button { border: 1px solid var(--h-border); background: var(--h-surface); border-radius: 8px; padding: 6px 8px; }
  .stage { padding: 12px 16px 24px; }
  .phone { width: 100%; max-width: 390px; height: auto; min-height: 760px; border-radius: 28px; }
  .phone .screen { height: calc(100% - 44px); min-height: 716px; }
}

/* ---------- 폰 프레임 ---------- */
.phone { width: 390px; height: 844px; background: var(--bg); color: var(--fg); border-radius: 44px; box-shadow: 0 0 0 10px var(--bezel), 0 24px 60px rgba(0,0,0,.25); position: relative; overflow: hidden; font-size: calc(15px * var(--zoom)); line-height: 1.47; display: flex; flex-direction: column; max-width: 100%; }
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-family: var(--font-num); font-weight: 600; font-size: 15px; color: var(--fg); position: relative; z-index: 3; }
.statusbar .icons { display: flex; gap: 5px; align-items: center; }
.statusbar .icons .ms { font-size: 16px; }
.phone.dark-chrome { background: #0d0d0c; }
.phone.dark-chrome .statusbar { color: #fff; }
.screen { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }
.scroll > * { flex-shrink: 0; }
.scroll.has-tab { padding-bottom: 96px; }
.scroll.has-cta { padding-bottom: 110px; }

/* 앱바 */
.appbar { height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
.appbar .title { font-weight: 700; font-size: 1.067em; flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
.appbar .title .meta { font-weight: 500; color: var(--fg-2); font-size: .867em; white-space: nowrap; }
.appbar .title.center { justify-content: center; text-align: center; }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--fg); display: inline-grid; place-items: center; flex: none; }
.iconbtn:hover { background: var(--surface); }
.progress { display: flex; gap: 6px; padding: 0 16px 8px; }
.progress i { height: 4px; flex: 1; border-radius: 2px; background: var(--border); }
.progress i.on { background: var(--brand); }

/* 타이포 */
.h1 { font-size: 1.6em; line-height: 1.33; font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.h2 { font-size: 1.333em; line-height: 1.4; font-weight: 700; margin: 0; }
.title { font-size: 1.133em; font-weight: 600; margin: 0; }
.body { font-size: 1em; margin: 0; }
.cap { font-size: .867em; color: var(--fg-2); margin: 0; }
.micro { font-size: .733em; font-weight: 500; }
.muted { color: var(--fg-2); }
.lead { color: var(--fg-2); margin: 4px 0 0; }

/* 카드·리스트 */
.card { background: var(--surface); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.outline { background: var(--bg); border: 1px solid var(--border); }
.card.brand { background: var(--brand-soft); }
.card.tappable { cursor: pointer; }
.card.tappable:hover { outline: 1px solid var(--border-strong); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-head .title { flex: 1; min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.kv .k { color: var(--fg-2); }
.kv .v { font-weight: 600; }
.divider { height: 1px; background: var(--border); margin: 2px 0; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .ms { color: var(--fg-2); }
.li .trail { color: var(--fg-2); display: flex; align-items: center; gap: 4px; }
.link { color: var(--brand); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 0; }
.link .ms { font-size: 18px; }
.inline-note { display: flex; gap: 8px; align-items: flex-start; color: var(--fg-2); font-size: .867em; }
.inline-note .ms { font-size: 18px; margin-top: 1px; }

/* 칩·배지 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .733em; font-weight: 500; line-height: 1.45; background: var(--surface); color: var(--fg-2); border: 1px solid var(--border); white-space: nowrap; }
.chip .ms { font-size: 14px; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.critical { background: var(--critical-soft); color: var(--critical); border-color: transparent; }
.chip.review { background: var(--review-soft); color: var(--review); border-color: transparent; }
.chip.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.chip.neutral { background: var(--surface); color: var(--fg-2); }
.chip.on-dark { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge-dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; font-weight: 600; font-size: 1em; background: var(--brand); color: var(--on-brand); width: 100%; }
.btn.secondary { background: var(--brand-soft); color: var(--brand); }
.btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--border-strong); }
.btn.quiet { background: var(--surface); color: var(--fg); }
.btn.critical { background: var(--critical); color: #fff; }
.btn.kakao { background: var(--kakao); color: var(--on-kakao); }
.btn.apple { background: var(--apple); color: var(--on-apple); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .867em; width: auto; white-space: nowrap; flex: none; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }
.cta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; flex-direction: column; gap: 8px; z-index: 2; }

/* 폼 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: .867em; color: var(--fg-2); font-weight: 500; }
.input { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); }
.input input { border: 0; background: transparent; flex: 1; min-width: 0; width: 100%; outline: none; font-size: 1.067em; font-weight: 600; font-family: var(--font-num); }
.input .unit { color: var(--fg-2); }
.input.disabled { opacity: .5; }
.seg { display: flex; background: var(--surface); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; border-radius: 999px; min-height: 40px; background: transparent; color: var(--fg-2); font-weight: 600; }
.seg button[aria-checked="true"], .seg button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.sm button { min-height: 32px; font-size: .867em; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch { width: 44px; height: 26px; border-radius: 999px; background: var(--border-strong); position: relative; flex: none; border: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--brand); }
.switch[aria-checked="true"]::after { left: 21px; }
.check { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--border-strong); display: inline-grid; place-items: center; flex: none; background: var(--bg); color: var(--on-brand); }
.check[aria-checked="true"] { background: var(--brand); border-color: var(--brand); }
.check .ms { font-size: 18px; }
.codes { display: flex; gap: 8px; justify-content: space-between; }
.codes span { flex: 1; aspect-ratio: 1 / 1.15; max-width: 48px; border-radius: 10px; border: 1px solid var(--border-strong); display: grid; place-items: center; font-family: var(--font-num); font-size: 1.6em; font-weight: 700; background: var(--bg); }
.codes span.active { border-color: var(--brand); border-width: 2px; }
.codes span.err { border-color: var(--critical); }
textarea.ta { width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); padding: 12px; resize: vertical; }

/* 탭바·FAB */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: start; padding: 8px 4px 0; z-index: 4; }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--fg-2); font-size: .733em; font-weight: 500; }
.tabbar button[aria-current="page"] { color: var(--brand); font-weight: 700; }
.fab { width: 56px; height: 56px; border-radius: 999px; background: var(--brand); color: var(--on-brand); border: 0; display: grid; place-items: center; margin: -22px auto 0; box-shadow: 0 6px 16px rgba(11,110,112,.35); grid-row: 1; grid-column: 3; justify-self: center; }
.fab-label { grid-column: 3; text-align: center; font-size: .733em; font-weight: 500; color: var(--fg-2); margin-top: 2px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--fg); opacity: .25; z-index: 5; }

/* 링 */
.ringcard { align-items: center; text-align: center; gap: 6px; padding-top: 18px; }
.ring { position: relative; width: 220px; height: 220px; }
.ring svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding-top: 6px; }
.ring .big { font-family: var(--font-num); font-size: 2.95em; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ring .big small { font-size: .45em; font-weight: 600; color: var(--fg-2); margin-left: 2px; letter-spacing: 0; }
.ring .sub { font-size: .867em; color: var(--fg-2); }
.ring .end-label { position: absolute; bottom: 12px; font-size: .733em; color: var(--fg-2); font-family: var(--font-num); font-weight: 600; }
.ring .end-label.l { left: 26px; } .ring .end-label.r { right: 14px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%; gap: 8px; }
.three > div { display: flex; flex-direction: column; align-items: center; gap: 0; }
.three .lab { font-size: .733em; color: var(--fg-2); display: flex; align-items: center; gap: 4px; }
.three .val { font-family: var(--font-num); font-size: 1.45em; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.three .val small { font-size: .55em; font-weight: 600; color: var(--fg-2); margin-left: 2px; }
.three .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* 반영률 4칸 */
.fill4 { display: inline-flex; gap: 3px; align-items: center; }
.fill4 i { width: 10px; height: 14px; border-radius: 2px; background: var(--good); display: inline-block; }
.fill4 i.off { background: transparent; border: 1.5px solid var(--border-strong); background-image: repeating-linear-gradient(135deg, var(--border-strong) 0 1px, transparent 1px 4px); }
.fill-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .867em; color: var(--fg-2); }
.fill-row b { color: var(--fg); }

/* 식사 슬롯 */
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface); text-align: left; border: 0; width: 100%; color: var(--fg); }
.slot .thumb { width: 56px; height: 56px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; font-size: 11px; position: relative; overflow: hidden; }
.slot .thumb.empty { border: 1.5px dashed var(--border-strong); color: var(--fg-2); background: transparent; }
.slot .thumb .ms { font-size: 26px; }
.slot .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.slot .name { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.slot .name .t { color: var(--fg-2); font-weight: 400; font-size: .867em; }
.slot .desc { font-size: .867em; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .kcal { font-family: var(--font-num); font-weight: 700; font-size: 1.2em; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.slot .kcal small { font-family: var(--font-body); font-size: .6em; font-weight: 500; color: var(--fg-2); }
.food { background: linear-gradient(135deg, #c96f3a, #8a3f1e); }
.food.b { background: linear-gradient(135deg, #d6a84a, #946a1c); }
.food.d { background: linear-gradient(135deg, #5c9a5a, #2e5f2e); }
.food.s { background: linear-gradient(135deg, #7a5a4a, #3f2a22); }

/* 게이지·바 */
.gauge { height: 8px; border-radius: 4px; background: var(--border-strong); overflow: hidden; position: relative; }
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); border-radius: 4px; }
.gauge i.warn { background: var(--warn); }
.bars { display: grid; grid-auto-flow: column; align-items: end; gap: 6px; height: 96px; padding-top: 14px; }
.bars .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; position: relative; }
.bars .bar i { width: 100%; max-width: 26px; background: var(--brand); border-radius: 4px 4px 0 0; display: block; opacity: .55; }
.bars .bar.today i { opacity: 1; }
.bars .bar .v { position: absolute; top: -14px; font-family: var(--font-num); font-size: .733em; font-weight: 600; color: var(--fg-2); }
.bars .bar .d { font-size: .667em; color: var(--fg-2); font-family: var(--font-num); }
.bars .bar.today .d { color: var(--brand); font-weight: 700; }

/* 리더보드 */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; padding: 8px 4px 0; }
.podium .p { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--surface); border-radius: 12px; padding: 12px 6px 10px; text-align: center; }
.podium .p.first { background: var(--brand-soft); }
.podium .avatar { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; }
.podium .p.first .avatar { width: 52px; height: 52px; }
.podium .rk { font-family: var(--font-num); font-weight: 700; font-size: .867em; color: var(--fg-2); display: flex; align-items: center; gap: 2px; }
.podium .nm { font-weight: 600; font-size: .867em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium .sc { font-family: var(--font-num); font-weight: 700; font-size: 1.2em; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; min-height: 56px; padding: 6px 10px; border-radius: 10px; }
.row .rk { font-family: var(--font-num); font-weight: 700; font-size: 1.067em; color: var(--fg-2); text-align: center; font-variant-numeric: tabular-nums; }
.row .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; overflow: hidden; }
.row .nm span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: .733em; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
.row .sc { font-family: var(--font-num); font-weight: 700; font-size: 1.2em; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.row .sc .heart { border: 0; background: transparent; color: var(--fg-2); width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; }
.row .sc .heart[aria-pressed="true"] { color: var(--critical); }
.row.me { background: var(--brand-soft); position: relative; }
.row.me::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--brand); }
.row.aggregating .nm { color: var(--review); }
.sticky-me { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0; }
.avatar.c1 { background: #B85C2A; } .avatar.c2 { background: #2F6E8F; } .avatar.c3 { background: #5E7A2F; } .avatar.c4 { background: #7A4F9A; } .avatar.c5 { background: #9A4F6E; } .avatar.c6 { background: #4F6E9A; }
.sm-avatar { width: 32px; height: 32px; border-radius: 999px; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }

/* 표 */
.table { width: 100%; border-collapse: collapse; font-size: .867em; }
.table th, .table td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table th { color: var(--fg-2); font-weight: 500; font-size: .92em; }
.table th:first-child, .table td:first-child { text-align: left; }
.table td.num { font-family: var(--font-num); font-weight: 600; font-size: 1.07em; }
.table tr.dim td { color: var(--fg-2); }
.table tr.today td { background: var(--brand-soft); }
.table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }

/* 규칙 카드 캐러셀 */
.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 8px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.rule { flex: none; width: 300px; min-height: 180px; scroll-snap-align: start; border-radius: 16px; padding: 16px 18px; background: var(--brand); color: var(--on-brand); display: flex; flex-direction: column; gap: 8px; }
.rule:nth-child(2) { background: #1F5E8F; } .rule:nth-child(3) { background: #4A3F8A; } .rule:nth-child(4) { background: #3E6B3A; }
:root[data-theme="dark"] .rule, :root:not([data-theme="light"]) .rule { color: #fff; }
.rule .no { font-family: var(--font-num); font-weight: 700; font-size: 1.6em; opacity: .85; }
.rule .t { font-weight: 700; font-size: 1.133em; }
.rule .b { font-size: .933em; line-height: 1.5; opacity: .95; flex: 1; }
.rule .c { font-size: .733em; opacity: .85; font-weight: 600; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 999px; background: var(--border-strong); }
.dots i.on { background: var(--brand); }

/* 시트·모달·토스트·배너 */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 6; display: flex; align-items: flex-end; }
.scrim.center { align-items: center; justify-content: center; padding: 24px; }
.sheet { background: var(--bg); color: var(--fg); border-radius: 16px 16px 0 0; padding: 12px 16px 32px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto 4px; }
.modal { background: var(--bg); color: var(--fg); border-radius: 16px; padding: 20px 18px 16px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 110px; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 8px; z-index: 7; font-weight: 500; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: .867em; }
.banner.brand { background: var(--brand-soft); color: var(--brand); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.critical { background: var(--critical-soft); color: var(--critical); }
.banner.review { background: var(--review-soft); color: var(--review); }
.banner.neutral { background: var(--surface); color: var(--fg-2); }
.banner .grow { flex: 1; min-width: 0; }
.banner b { font-weight: 600; }
.banner .x { border: 0; background: transparent; color: inherit; width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; flex: none; }

/* 날짜 스트립 */
.dates { display: flex; justify-content: space-between; gap: 4px; }
.dates button { flex: 1; border: 0; background: transparent; color: var(--fg-2); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; font-size: .733em; }
.dates button .d { font-family: var(--font-num); font-weight: 700; font-size: 1.35em; color: var(--fg); }
.dates button[aria-current="date"] { background: var(--brand); color: var(--on-brand); }
.dates button[aria-current="date"] .d { color: var(--on-brand); }
.dates button.future { opacity: .4; }
.dates button .m { width: 5px; height: 5px; border-radius: 999px; background: var(--good); }

/* 카메라 */
.cam { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, #3c3a37 0%, #1b1a19 60%, #0d0d0c 100%); color: #fff; display: flex; flex-direction: column; }
.cam .top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px 0 8px; }
.cam .guide { position: absolute; left: 36px; right: 36px; top: 160px; aspect-ratio: 1; border: 2px dashed rgba(255,255,255,.55); border-radius: 999px; display: grid; place-items: center; text-align: center; padding: 24px; font-size: .933em; color: rgba(255,255,255,.9); }
.cam .plate { position: absolute; left: 70px; right: 70px; top: 196px; aspect-ratio: 1; border-radius: 999px; background: radial-gradient(circle at 40% 35%, #e9e2d6 0 60%, #cfc6b7 61% 100%); box-shadow: inset 0 0 0 10px #f5f1ea, 0 10px 30px rgba(0,0,0,.5); opacity: .5; }
.cam .bottom { margin-top: auto; padding: 0 16px 36px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.cam .seg { background: rgba(255,255,255,.12); }
.cam .seg button { color: rgba(255,255,255,.75); }
.cam .seg button[aria-checked="true"] { background: #fff; color: #111; }
.shutter { width: 72px; height: 72px; border-radius: 999px; border: 4px solid #fff; background: transparent; display: grid; place-items: center; }
.shutter::after { content: ''; width: 56px; height: 56px; border-radius: 999px; background: #fff; }
.cam .aux { color: rgba(255,255,255,.85); font-size: .867em; background: none; border: 0; text-decoration: underline; }

/* 항목 카드(P7) */
.item { gap: 10px; }
.item .top { display: flex; align-items: flex-start; gap: 10px; }
.item .top .check { margin-top: 2px; }
.item .top .grow { flex: 1; min-width: 0; }
.item .nm { font-weight: 700; font-size: 1.067em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .assume { font-size: .867em; color: var(--fg-2); }
.item .kc { font-family: var(--font-num); font-weight: 700; font-size: 1.33em; font-variant-numeric: tabular-nums; }
.item .kc small { font-size: .55em; font-family: var(--font-body); color: var(--fg-2); font-weight: 500; }
.cands { display: flex; gap: 6px; flex-wrap: wrap; }
.cands button { border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 5px 10px; font-size: .8em; min-height: 32px; }
.cands button[aria-checked="true"] { background: var(--brand-soft); color: var(--brand); border-color: transparent; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; }
.stepper button { width: 40px; height: 36px; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center; }
.stepper > span { min-width: 40px; text-align: center; font-family: var(--font-num); font-weight: 700; }
.item.unchecked .top .grow, .item.unchecked .cands, .item.unchecked .seg, .item.unchecked .stepper, .item.unchecked .toggle-row { opacity: .4; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .867em; }
.totalbar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.totalbar .cur { font-family: var(--font-num); font-weight: 700; font-size: 1.8em; font-variant-numeric: tabular-nums; }
.totalbar .cur small { font-size: .5em; font-family: var(--font-body); color: var(--fg-2); font-weight: 500; }
.photo { height: 150px; border-radius: 12px; background: linear-gradient(135deg, #b3552d 0%, #7a3417 45%, #3b1a0d 100%); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 10px 12px; color: #fff; }
.photo::before { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 999px; right: -30px; top: -40px; background: radial-gradient(circle at 40% 40%, #f3e9d8 0 58%, #d9c9ad 59% 100%); opacity: .25; }
.photo .tag { background: rgba(0,0,0,.45); border-radius: 999px; padding: 3px 10px; font-size: .733em; font-weight: 600; }

/* 설정 리스트 */
.settings .li .ms { color: var(--fg-2); }
.sec-title { font-size: .733em; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); font-weight: 600; margin: 8px 0 -4px; }

/* 스켈레톤 */
.skel { background: linear-gradient(90deg, var(--surface), var(--border), var(--surface)); border-radius: 8px; height: 14px; }
.disclaimer { text-align: center; font-size: .733em; color: var(--fg-2); padding-top: 4px; }
.formula { font-family: var(--font-num); font-size: 1.067em; font-weight: 600; line-height: 1.6; font-variant-numeric: tabular-nums; }
.formula b { color: var(--brand); font-size: 1.25em; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="harness">
  <aside class="panel" aria-label="검수 패널">
    <h1><span class="mark">C</span>챌로리 프로토타입</h1>
    <p class="sub">참가자 앱 P1~P12 · 06-화면-설계.md</p>
    <div class="sec">화면</div>
    <nav class="nav" id="nav" aria-label="화면 목록"></nav>
    <div class="sec">상태 변형</div>
    <div class="variants" id="variants"></div>
    <div class="sec">검수 설정</div>
    <div class="ctrl" id="themeCtrl" role="group" aria-label="테마">
      <button data-theme="system" aria-pressed="true"><span class="ms xs">contrast</span>시스템</button>
      <button data-theme="light"><span class="ms xs">light_mode</span>라이트</button>
      <button data-theme="dark"><span class="ms xs">dark_mode</span>다크</button>
    </div>
    <div class="ctrl">
      <button id="zoomBtn" aria-pressed="false"><span class="ms xs">format_size</span>글자 120%</button>
    </div>
    <p class="sub" style="margin-left:0">해시 URL로 모든 변형에 직접 도달: <code>#p5-review</code></p>
    <div class="sec">운영자</div>
    <div class="ctrl"><a class="link" href="console.html" style="font-size:13px; color:var(--h-accent)"><span class="ms xs">open_in_new</span>운영자 웹 콘솔 OP1~OP4</a></div>
  </aside>

  <main class="stage">
    <div class="mobilebar">
      <select id="mScreen" aria-label="화면 선택"></select>
      <select id="mVariant" aria-label="상태 변형 선택"></select>
      <button id="mTheme" aria-label="테마 전환"><span class="ms xs">contrast</span></button>
      <a href="console.html" aria-label="운영자 웹 콘솔" style="border:1px solid var(--h-border);border-radius:8px;padding:6px 8px;color:inherit;display:inline-flex"><span class="ms xs">admin_panel_settings</span></a>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="phone" id="phone">
      <div class="statusbar" aria-hidden="true"><span id="clock">21:10</span><span class="icons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_5_bar</span></span></div>
      <div class="screen" id="screen" aria-live="polite"></div>
    </div>
  </main>

  <aside class="notes" id="notes" aria-label="화면 노트"></aside>
</div>

<script src="data.js"></script>
<script>
/* ======================= 공용 ======================= */
const { ENGINE, CONST, fmt, CHALLENGE, ME, TODAY, FINAL, TODAY_MEALS, LUNCH_DRAFT, TODAY_ACTIVITY, TODAY_ACTIVITY_IOS, WATCH_USER, WATCH_ACTIVITY, WATCH_MEALS, WATCH_TODAY, LEDGER, CUMULATIVE, TODAY_ROW, LEADERBOARD, REASON, VERDICT } = window.CHALLORY;
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ms = (name, cls = '') => `<span class="ms ${cls}" aria-hidden="true">${name}</span>`;
const chip = (text, kind = 'neutral', icon = '') => `<span class="chip ${kind}">${icon ? ms(icon) : ''}${text}</span>`;
const go = (target, label, cls = 'link') => `<button class="${cls}" data-go="${target}">${label}</button>`;
const kcal = (n) => `${fmt.kcal(n)} kcal`;

const weekday = (md) => { const [m, d] = md.split('.').map(Number); return ['일', '월', '화', '수', '목', '금', '토'][new Date(2026, m - 1, d).getDay()]; }; // 실제 2026년 달력
const SLOT_LABEL = { breakfast: '아침', lunch: '점심', dinner: '저녁', snack: '간식' };
const SLOT_TIME = { breakfast: '04~10:30', lunch: '~15:00', dinner: '~22:00', snack: '그 외' };
const SLOT_TOKEN = { breakfast: 'b', lunch: '', dinner: 'd', snack: 's' };
const AVATAR_COLORS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'];
const avatarCls = (name) => AVATAR_COLORS[[...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AVATAR_COLORS.length];

/* 앱바 */
function appbar({ title, meta = '', back = null, actions = '', center = false }) {
  return `<div class="appbar">
    ${back ? `<button class="iconbtn" data-go="${back}" aria-label="뒤로">${ms('arrow_back')}</button>` : ''}
    <div class="title ${center ? 'center' : ''}"><span>${esc(title)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</div>
    ${actions}
  </div>`;
}
function tabbar(active) {
  const t = (id, icon, label, target) => `<button data-go="${target}" ${active === id ? 'aria-current="page"' : ''}>${ms(icon, active === id ? 'fill' : '')}<span>${label}</span></button>`;
  return `<nav class="tabbar" aria-label="주 탭">
    ${t('home', 'home', '홈', 'p5')}
    ${t('rank', 'leaderboard', '순위', 'p9')}
    <button class="fab" data-go="p6" aria-label="식사 촬영">${ms('photo_camera')}</button>
    ${t('act', 'directions_walk', '활동', 'p8')}
    ${t('rule', 'gavel', '규칙', 'p11')}
    <span class="fab-label" aria-hidden="true">촬영</span>
  </nav><div class="home-ind" aria-hidden="true"></div>`;
}
function progressBar(step) { return `<div class="progress" aria-label="진행 ${step}/3">${[1, 2, 3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`; }
function fill4(cells, pct) { // cells: [아침, 점심, 저녁, 걸음] boolean
  const labels = ['아침', '점심', '저녁', '걸음'];
  const sr = labels.map((l, i) => `${l} ${cells[i] ? (i === 3 ? '동기화됨' : '확정') : (i === 3 ? '미동기화' : '미확정')}`).join(', ');
  return `<span class="fill-row"><span class="fill4" role="img" aria-label="${sr} · 반영률 ${pct}%">${cells.map(c => `<i class="${c ? '' : 'off'}"></i>`).join('')}</span><span aria-hidden="true">${labels.map((l, i) => `${l} ${cells[i] ? '✓' : '–'}`).join(' · ')} · <b>반영률 ${pct}%</b></span></span>`;
}

/* 링 (270° 게이지). ratio 0~1.5, provisional → 점선 끝 */
function ring({ D, ratio, provisional = true, label, sub, empty = false }) {
  const r = 92, cx = 110, cy = 112, arc = 270, start = 135;
  const polar = (deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const arcPath = (fromDeg, toDeg) => { const [x1, y1] = polar(fromDeg), [x2, y2] = polar(toDeg); const large = toDeg - fromDeg > 180 ? 1 : 0; return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const p = Math.min(ratio, 1);
  const over = ratio > 1;
  const endDeg = start + arc * p;

      ${!empty && p > 0.001 ? `<path d="${arcPath(start, endDeg)}" fill="none" stroke="var(--brand)" stroke-width="18" stroke-linecap="round" ${provisional ? 'stroke-dasharray="6 5"' : ''}/>` : ''}
      ${over ? `<g transform="translate(${(dx + 14).toFixed(1)} ${(dy + 10).toFixed(1)})"><circle r="9" fill="var(--brand)"/><text y="3.5" text-anchor="middle" font-size="9" font-weight="700" fill="var(--on-brand)" font-family="var(--font-num)">+</text></g>` : ''}
    </svg>
    <div class="center"><div class="big">${label}</div><div class="sub">${esc(sub)}</div></div>
    <span class="end-label l" aria-hidden="true">0</span><span class="end-label r" aria-hidden="true">−${CONST.T}</span>
  </div>`;
}

/* ---------- P10 점수 장부·소명 ---------- */
def('p10', '점수 장부·소명', { default: '잠정(오늘)', revision: '정정 이력', review: '검토 중 + 소명 입력', 'verdict-approve': '판정: 승인', 'verdict-warn': '판정: 경고', 'verdict-void': '판정: 무효', 'verdict-exclude': '판정: 순위 제외', expired: '소명 기간 만료', objection: '결과 이의' }, (v) => {

/* ---------- P12 설정 ---------- */
def('p12', '설정', { default: '정상', disconnected: '연결 끊김', 'push-off': 'OS 알림 꺼짐', notices: '공지 목록', delete: '계정 삭제 모달', 'weight-read': '건강 앱 체중 읽기' }, (v) => {

    </div>

  purpose: '계정·연결·공개 범위·동의 관리. 체중은 참고 기록(순위·BMR 미반영).',

<script>
/* ======================= 라우터·인터랙션 ======================= */
const ORDER = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8', 'p9', 'p10', 'p11', 'p12'];
let CURRENT = { id: 'p5', variant: 'default' };
const screenEl = document.getElementById('screen');
const phoneEl = document.getElementById('phone');

function parseHash() {
  const h = (location.hash || '#p5').slice(1).toLowerCase();
  const m = h.match(/^(p\d{1,2})(?:-(.+))?$/);
  if (!m || !SCREENS[m[1]]) return { id: 'p5', variant: 'default' };
  const s = SCREENS[m[1]];
  const variant = m[2] && s.variants[m[2]] ? m[2] : 'default';
  return { id: m[1], variant };
}
function navigate(target) { // 'p7' | 'p7-auto'
  const [id, ...rest] = target.split('-');
  const variant = rest.join('-') || 'default';
  const newHash = '#' + id + (variant !== 'default' ? '-' + variant : '');
  if (location.hash === newHash) render(); else location.hash = newHash;
}
function render() {
  CURRENT = parseHash();
  const s = SCREENS[CURRENT.id];
  screenEl.innerHTML = s.render(CURRENT.variant);
  phoneEl.classList.toggle('dark-chrome', CURRENT.id === 'p6');
  screenEl.querySelectorAll('.scroll').forEach(el => { el.scrollTop = 0; });
  renderNav(); renderNotes();
  document.getElementById('crumbs').innerHTML = `<span>${s.id.toUpperCase()}</span><b>${esc(s.name)}</b><span>·</span><span>${esc(s.variants[CURRENT.variant])}</span><span>·</span><code style="font-size:11px">${esc(location.hash || '#p5')}</code>`;
  // P6 토스트 → 1.5초 후 홈
  if (CURRENT.id === 'p6' && CURRENT.variant === 'toast') setTimeout(() => { if (CURRENT.id === 'p6' && CURRENT.variant === 'toast') navigate('p5'); }, 1500);
}
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = ORDER.map(id => `<button data-nav="${id}" ${id === CURRENT.id ? 'aria-current="true"' : ''}><span class="id">${id.toUpperCase()}</span><span>${esc(SCREENS[id].name)}</span></button>`).join('');
  const s = SCREENS[CURRENT.id];
  document.getElementById('variants').innerHTML = Object.entries(s.variants).map(([k, label]) => `<button data-nav="${CURRENT.id}${k === 'default' ? '' : '-' + k}" aria-pressed="${k === CURRENT.variant}">${esc(label)}</button>`).join('');
  const mS = document.getElementById('mScreen'), mV = document.getElementById('mVariant');
  mS.innerHTML = ORDER.map(id => `<option value="${id}" ${id === CURRENT.id ? 'selected' : ''}>${id.toUpperCase()} ${esc(SCREENS[id].name)}</option>`).join('');
  mV.innerHTML = Object.entries(s.variants).map(([k, label]) => `<option value="${CURRENT.id}${k === 'default' ? '' : '-' + k}" ${k === CURRENT.variant ? 'selected' : ''}>${esc(label)}</option>`).join('');
}
function renderNotes() {
  const s = SCREENS[CURRENT.id]; const n = s.notes;
  document.getElementById('notes').innerHTML = `<h2>${s.id.toUpperCase()} ${esc(s.name)}</h2><p>${esc(n.purpose)}</p>
    ${n.interactive ? `<p style="color:var(--h-accent)">${esc(n.interactive)}</p>` : ''}
    <h3>규칙·근거</h3><ul>${n.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    <h3>연결</h3><ul>${n.links.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    <h3>현재 변형</h3><p><code>${esc(location.hash || '#' + s.id)}</code> — ${esc(s.variants[CURRENT.variant])}</p>
    <h3>문서</h3><p>docs/06-화면-설계.md §4 ${s.id.toUpperCase()} · docs/04 산식 · 예시 데이터 data.js</p>`;
}

/* 클릭 위임 */
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]'); if (navBtn) { navigate(navBtn.dataset.nav); return; }
  const heart = e.target.closest('[data-heart]');
  if (heart) { const name = heart.dataset.heart; if (HEARTED.has(name)) { toast('내일 다시 응원할 수 있어요'); } else { HEARTED.add(name); toast(`${name}님을 응원했어요 (오늘 1회)`); render(); } return; }
  const act = e.target.closest('[data-act]');
  if (act && CURRENT.id === 'p7') { p7Action(act); return; }
  const goEl = e.target.closest('[data-go]');
  if (goEl) { if (goEl.getAttribute('aria-disabled') === 'true') return; navigate(goEl.dataset.go); return; }
  const sw = e.target.closest('.switch[role="switch"]:not([data-act])');
  if (sw && !sw.disabled) { sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true'); return; }
  const themeBtn = e.target.closest('#themeCtrl button');
  if (themeBtn) { setTheme(themeBtn.dataset.theme); return; }
  if (e.target.closest('#mTheme')) { const cur = document.documentElement.getAttribute('data-theme'); setTheme(cur === 'dark' ? 'light' : cur === 'light' ? 'system' : 'dark'); return; }
  if (e.target.closest('#zoomBtn')) { const b = document.getElementById('zoomBtn'); const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); document.documentElement.style.setProperty('--zoom', on ? '1.2' : '1'); return; }
});
document.getElementById('mScreen').addEventListener('change', (e) => navigate(e.target.value));
document.getElementById('mVariant').addEventListener('change', (e) => navigate(e.target.value));

function p7Action(el) {
  const card = el.closest('[data-item]'); const it = P7.items[+card.dataset.item]; const a = el.dataset.act;
  if (a === 'toggle') it.checked = !it.checked;
  if (a === 'cand') { it.cand = +el.dataset.ci; it.name = it.candidates[it.cand]; }
  if (a === 'mult') it.mult = +el.dataset.m;
  if (a === 'broth') it.brothOff = !it.brothOff;
  if (a === 'inc') { if (it.kind === 'count') it.count = Math.min(9, it.count + 1); else it.mult = Math.min(3, it.mult + 1); }
  if (a === 'dec') { if (it.kind === 'count') it.count = Math.max(1, it.count - 1); else it.mult = Math.max(0.5, it.mult - 0.5); }
  if (a === 'search') { toast('식약처 DB 검색 (프로토타입에서는 생략)'); return; }
  const scrollEl = screenEl.querySelector('.scroll'); const top = scrollEl ? scrollEl.scrollTop : 0;
  screenEl.innerHTML = SCREENS.p7.render(CURRENT.variant);
  const s2 = screenEl.querySelector('.scroll'); if (s2) s2.scrollTop = top;
}
document.addEventListener('input', (e) => {
  const sim = e.target.closest('[data-sim]');
  if (sim) { SIM[sim.dataset.sim] = Math.max(0, parseInt(sim.value.replace(/[^\d]/g, ''), 10) || 0); const focusId = sim.id; const selStart = sim.selectionStart;
    const scrollEl = screenEl.querySelector('.scroll'); const top = scrollEl ? scrollEl.scrollTop : 0;
    screenEl.innerHTML = SCREENS.p11.render(CURRENT.variant);
    const s2 = screenEl.querySelector('.scroll'); if (s2) s2.scrollTop = top;
    const f = document.getElementById(focusId); if (f) { f.focus(); try { f.setSelectionRange(selStart, selStart); } catch (_) {} } }
  if (e.target.id === 'appeal') { const c = e.target.parentElement.querySelector('.cap[style*="right"]'); if (c) c.textContent = `${e.target.value.length} / 500`; }
  if (e.target.id === 'delc') { const b = e.target.closest('.modal').querySelector('.btn.critical'); b.setAttribute('aria-disabled', e.target.value.trim() !== '삭제'); }
});
screenEl.addEventListener('scroll', (e) => {
  if (e.target.id === 'ruleCarousel') { const i = Math.round(e.target.scrollLeft / 310); document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i)); }
}, true);

let toastTimer;
function toast(msg) {
  let t = screenEl.querySelector('.toast.sys'); if (!t) { t = document.createElement('div'); t.className = 'toast sys'; t.setAttribute('role', 'status'); screenEl.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
function setTheme(mode) {
  if (mode === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('#themeCtrl button').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === mode));
  try { localStorage.setItem('challory-theme', mode); } catch (_) {}
}
try { const saved = localStorage.getItem('challory-theme'); if (saved && saved !== 'system') setTheme(saved); } catch (_) {}
window.showScreen = (id) => navigate(id); // 스크린샷 도구용
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
