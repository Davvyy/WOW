<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챌로리 운영자 콘솔</title>
<meta name="description" content="다이어트 챌린지 앱 챌로리(Challory) 운영자 웹 콘솔 OP1~OP4 클릭 프로토타입 — docs/06-화면-설계.md 'OP 화면(웹)' 기준. 모든 숫자는 data.js ENGINE으로 계산.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<style>
/* =========================================================
   운영자 콘솔 — 06 §5.1 토큰을 index.html과 동일하게 사용.
   기준 프레임 1280px, 최소 1024px. 검수 바(상단 슬림)만 제품 UI 밖.
   ========================================================= */
:root {
  --bg: #FFFFFF; --surface: #F4F6F8; --fg: #1A1C1E; --fg-2: #4A4F55;
  --border: #DDE1E6; --border-strong: #808992;
  --brand: #0B6E70; --on-brand: #FFFFFF; --brand-soft: #DCF1F1;
  --good: #176F33; --good-soft: #E3F5E8;
  --warn: #8A5A00; --warn-soft: #FFF1D6;
  --critical: #B3261E; --critical-soft: #FBE4E2;
  --review: #5B4FCF; --review-soft: #ECEAFB;
  --ring-track: var(--border-strong);
  --intake: #DC6420; --burn: #0B9EA9;
  --kakao: #FEE500; --on-kakao: #191919; --apple: #000000; --on-apple: #FFFFFF;
  --h-bg: #E6EBEC; --h-fg: #1A1C1E; --h-fg-2: #4F5A5E; --h-surface: #FFFFFF; --h-border: #CBD3D6; --h-accent: #0B6E70;
  --bezel: #121417;
  --font-body: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-num: 'Barlow Semi Condensed', 'IBM Plex Sans KR', system-ui, sans-serif;
  --shadow: 0 8px 28px rgba(0,0,0,.14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1C1F24; --fg: #E6E8EB; --fg-2: #A3A9B1;
    --border: #2A2F36; --border-strong: #6A727C;
    --brand: #5FD3D5; --on-brand: #0B1F20; --brand-soft: #163F40;
    --good: #6CCB84; --good-soft: #1B3A25;
    --warn: #F2B84B; --warn-soft: #3D2E0F;
    --critical: #FF8A80; --critical-soft: #4A1A17;
    --review: #B4ACFF; --review-soft: #272352;
    --intake: #DD7434; --burn: #1F9EA8;
    --h-bg: #0B0F10; --h-fg: #E6E8EB; --h-fg-2: #A3A9B1; --h-surface: #15191C; --h-border: #2A3237; --h-accent: #5FD3D5;
    --bezel: #2A2F36;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1C1F24; --fg: #E6E8EB; --fg-2: #A3A9B1;
  --border: #2A2F36; --border-strong: #6A727C;
  --brand: #5FD3D5; --on-brand: #0B1F20; --brand-soft: #163F40;
  --good: #6CCB84; --good-soft: #1B3A25;
  --warn: #F2B84B; --warn-soft: #3D2E0F;
  --critical: #FF8A80; --critical-soft: #4A1A17;
  --review: #B4ACFF; --review-soft: #272352;
  --intake: #DD7434; --burn: #1F9EA8;
  --h-bg: #0B0F10; --h-fg: #E6E8EB; --h-fg-2: #A3A9B1; --h-surface: #15191C; --h-border: #2A3237; --h-accent: #5FD3D5;
  --bezel: #2A2F36;
  --shadow: 0 8px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; flex: none; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.sm { font-size: 18px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
.ms.sm.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
.ms.xs { font-size: 14px; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.ms.xs.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- 검수 바(제품 UI 밖) ---------- */
.hbar { position: sticky; top: 0; z-index: 40; min-height: 44px; background: var(--h-bg); color: var(--h-fg); border-bottom: 1px solid var(--h-border); display: flex; align-items: center; gap: 10px; padding: 6px 16px; flex-wrap: wrap; }
.hbar .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--h-accent); color: #fff; display: inline-grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 13px; }
.hbar .ttl { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.hbar .ttl small { color: var(--h-fg-2); font-weight: 500; }
.hbar .sec { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--h-fg-2); font-weight: 600; margin-left: 10px; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; }
.variants button { border: 1px solid var(--h-border); background: var(--h-surface); color: var(--h-fg); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.variants button[aria-pressed="true"] { background: var(--h-fg); color: var(--h-surface); border-color: var(--h-fg); }
.hbar .spacer { flex: 1; }
.ctrl { display: flex; gap: 6px; align-items: center; }
.ctrl button, .ctrl a { border: 1px solid var(--h-border); background: var(--h-surface); color: var(--h-fg); border-radius: 8px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.ctrl button[aria-pressed="true"] { border-color: var(--h-accent); color: var(--h-accent); font-weight: 600; }
.hbar code { background: var(--h-surface); border: 1px solid var(--h-border); padding: 1px 6px; border-radius: 4px; font-size: 11px; }
@media (max-width: 1440px) { .hbar .ttl small, .hbar .sec { display: none; } }
@media (max-width: 1180px) { .hbar #hashcode { display: none; } }

/* ---------- 콘솔 레이아웃 ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 44px); }
.sidenav { background: var(--surface); border-right: 1px solid var(--border); padding: 14px 10px 18px; position: sticky; top: 44px; height: calc(100vh - 44px); overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.sidenav .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.sidenav .brand .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 18px; flex: none; }
.sidenav .brand .t { font-weight: 700; font-size: 15px; line-height: 1.2; }
.sidenav .brand .s { color: var(--fg-2); font-size: 12px; }
.sidenav .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); font-weight: 600; padding: 8px 10px 4px; }
.sidenav .item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 10px; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--fg); text-align: left; width: 100%; }
.sidenav .item .ms { color: var(--fg-2); }
.sidenav .item .id { font-family: var(--font-num); font-weight: 600; color: var(--fg-2); font-size: 12px; display: block; line-height: 1.1; }
.sidenav .item .nm { font-weight: 600; font-size: 13px; line-height: 1.25; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidenav .item:hover { background: var(--bg); }
.sidenav .item[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.sidenav .item[aria-current="page"] .ms, .sidenav .item[aria-current="page"] .id { color: var(--brand); }
.sidenav .item.sub { padding-left: 22px; }
.badge { min-width: 22px; height: 22px; border-radius: 999px; background: var(--critical); color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 12px; display: inline-grid; place-items: center; padding: 0 6px; }
.badge.zero { background: var(--border-strong); }
:root[data-theme="dark"] .badge, :root:not([data-theme="light"]) .badge { color: #1A1C1E; }
.sidenav .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
.sidenav .foot .av { width: 28px; height: 28px; border-radius: 999px; background: #2F6E8F; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { min-height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 8px 24px; position: sticky; top: 44px; background: var(--bg); z-index: 10; flex-wrap: wrap; }
.topbar .cname { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar .cname .code { font-family: var(--font-num); font-weight: 600; color: var(--fg-2); font-size: 13px; letter-spacing: .06em; }
.topbar .dday { color: var(--fg-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.topbar .dday b { color: var(--fg); font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.topbar .grow { flex: 1; }
.topbar .sync { font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 999px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.pill .ms { font-size: 18px; }
.pill small { font-weight: 500; opacity: .85; font-family: var(--font-num); letter-spacing: .02em; }
.pill.neutral { background: var(--surface); color: var(--fg-2); border: 1px solid var(--border-strong); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.critical { background: var(--critical-soft); color: var(--critical); }
.pill.review { background: var(--review-soft); color: var(--review); }
.content { padding: 20px 24px 56px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1280px; margin: 0 auto; min-width: 0; }
.content > * { min-width: 0; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pagehead h1 { font-size: 22px; line-height: 1.3; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.pagehead h1 .id { font-family: var(--font-num); color: var(--fg-2); font-weight: 600; font-size: 15px; }
.pagehead .lead { margin: 2px 0 0; color: var(--fg-2); }
.pagehead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); }
  .sidenav { padding: 14px 8px; }
  .sidenav .brand .t, .sidenav .brand .s, .sidenav .lbl, .sidenav .item .nm, .sidenav .foot span { display: none; }
  .sidenav .item { grid-template-columns: 24px auto; justify-content: center; gap: 4px; padding: 9px 6px; }
  .sidenav .item .id { font-size: 11px; }
  .sidenav .item.sub { padding-left: 6px; }
  .sidenav .brand { justify-content: center; padding-left: 0; padding-right: 0; }
  .content { padding: 16px 16px 48px; }
  .topbar { padding: 8px 16px; }
}

/* ---------- 타이포·카드·그리드 ---------- */
.h2 { font-size: 16px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; scroll-margin-top: 124px; }
.h2 .cap { font-weight: 500; }
.title { font-size: 15px; font-weight: 600; margin: 0; }
.cap { font-size: 12px; color: var(--fg-2); margin: 0; }
.body { margin: 0; }
.muted { color: var(--fg-2); }
.card { background: var(--surface); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.outline { background: var(--bg); border: 1px solid var(--border); }
.card.brand { background: var(--brand-soft); }
.card.review-soft { background: var(--review-soft); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-head .title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 16px; }
.grid.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.grid.form-preview { grid-template-columns: minmax(0, 1fr) 390px; align-items: start; }
.grid.const { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid.fields2 { grid-template-columns: 1fr 1fr; gap: 12px; }
.grid.fields3 { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid.csv { grid-template-columns: 1fr 1fr; gap: 10px; }
button.card:not(.outline) { border: 0; }
@media (max-width: 1100px) { .grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.const { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.kpi .card { gap: 4px; padding: 14px 16px; }
.kpi .k { font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-family: var(--font-num); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
.kpi .v small { font-size: 14px; font-weight: 600; color: var(--fg-2); font-family: var(--font-body); }
.kpi .s { font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.kv .k { color: var(--fg-2); }
.kv .v { font-weight: 600; }
.divider { height: 1px; background: var(--border); margin: 2px 0; }
.inline-note { display: flex; gap: 8px; align-items: flex-start; color: var(--fg-2); font-size: 12px; }
.inline-note .ms { font-size: 18px; margin-top: -1px; }
.disclaimer { font-size: 12px; color: var(--fg-2); margin: 0; }
.link { color: var(--brand); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 0; cursor: pointer; }
.link .ms { font-size: 18px; }

/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; background: var(--surface); color: var(--fg-2); border: 1px solid var(--border); white-space: nowrap; }
.chip .ms { font-size: 14px; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.critical { background: var(--critical-soft); color: var(--critical); border-color: transparent; }
.chip.review { background: var(--review-soft); color: var(--review); border-color: transparent; }
.chip.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.chip.neutral { background: var(--surface); color: var(--fg-2); }
.chip.outline { background: var(--bg); border-color: var(--border-strong); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filter { display: flex; flex-wrap: wrap; gap: 6px; }
.filter button { border: 1px solid var(--border-strong); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.filter button .n { font-family: var(--font-num); font-weight: 700; color: var(--fg-2); }
.filter button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.filter button[aria-pressed="true"] .n { color: inherit; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; font-weight: 600; font-size: 14px; background: var(--brand); color: var(--on-brand); white-space: nowrap; }
.btn .ms { font-size: 20px; }
.btn.secondary { background: var(--brand-soft); color: var(--brand); }
.btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--border-strong); }
.btn.quiet { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
.btn.critical { background: var(--critical); color: #fff; }
:root[data-theme="dark"] .btn.critical, :root:not([data-theme="light"]) .btn.critical { color: #1A1C1E; }
.btn.critical.ghost { background: transparent; color: var(--critical); border-color: var(--critical); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn.sm .ms { font-size: 18px; }
.btn.lg { min-height: 48px; padding: 0 22px; font-size: 15px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.iconbtn { width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; color: var(--fg); display: inline-grid; place-items: center; flex: none; }
.iconbtn:hover { background: var(--surface); }

/* 폼 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lab { font-size: 12px; color: var(--fg-2); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
.field .lab .ms { font-size: 14px; }
.input { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); }
.input input, .input select { border: 0; background: transparent; flex: 1; min-width: 0; width: 100%; outline: none; font-size: 14px; font-weight: 600; padding: 0; }
.input input.num { font-family: var(--font-num); font-size: 15px; }
.input .unit { color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.input.ro { background: var(--surface); border-color: var(--border); color: var(--fg-2); }
.input.ro input { color: var(--fg-2); }
.input .ms { font-size: 18px; color: var(--fg-2); }
textarea.ta { width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); padding: 10px 12px; resize: vertical; line-height: 1.55; }
textarea.ta.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.counter { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--fg-2); font-size: 12px; }
.counter.over { color: var(--critical); font-weight: 700; }
.radios { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.radio { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; }
.radio input { width: 18px; height: 18px; margin: 0; accent-color: var(--brand); flex: none; }
.radio .t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.radio .d { font-size: 12px; color: var(--fg-2); }
.radio:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.radio:has(input:disabled) { opacity: .6; cursor: default; }
.checkrow { display: flex; align-items: flex-start; gap: 10px; }
.checkrow input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--brand); flex: none; }
.checkrow .d { font-size: 12px; color: var(--fg-2); display: block; }

/* 표 */
.table-wrap { overflow-x: auto; max-width: 100%; }

const ms = (name, cls = '') => `<span class="ms ${cls}" aria-hidden="true">${name}</span>`;

const signed1 = (n) => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt.k1(Math.abs(n));

const median = (arr) => { const a = [...arr].sort((x, y) => x - y); const m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
// 조사 '(으)로': 받침 없음·ㄹ 받침·숫자 1,2,4,5,7,8,9 → '로', 그 외 → '으로' (06 §6 예: "대체값 743으로")
function ro(word) {
  const ch = String(word).trim().slice(-1);
  if (/[0-9]/.test(ch)) return '1245789'.includes(ch) ? '로' : '으로';
  const code = ch.charCodeAt(0); if (code < 0xAC00 || code > 0xD7A3) return '로';
  const fin = (code - 0xAC00) % 28; return fin === 0 || fin === 8 ? '로' : '으로';
}

/* ======================= 참가자 데이터(엔진으로 계산) ======================= */
const DATES = LEDGER.map(r => r.date);
const PEOPLE_RAW = [
  { name: '달려라하니', sex: 'F', birthYear: 1992, heightCm: 165, weightKg: 57, device: 'iPhone + Apple Watch', source: 'Apple 건강', platform: 'HealthKit', badge: 'watch', baseSteps: 12400, spikeDay: 7, spikeSteps: 28400, mealScale: 0.8, status: 'review', flag: 'steps_spike', warns: 0, mealsToday: 3, syncAt: '21:05' },
  { name: '강남콩', sex: 'M', birthYear: 1990, heightCm: 178, weightKg: 76, device: 'Galaxy', source: '삼성헬스', platform: 'Health Connect', baseSteps: 11800, status: 'ok', warns: 0, mealsToday: 3, syncAt: '21:10', health: 'high_activity_3d' },
  { name: WATCH_USER.nickname, sex: WATCH_USER.sex, birthYear: WATCH_USER.birthYear, heightCm: WATCH_USER.heightCm, weightKg: WATCH_USER.weightKg, device: WATCH_USER.device, source: WATCH_USER.source, platform: 'HealthKit', badge: 'watch', baseSteps: 11500, lowIntakeDays: [4, 5, 6], status: 'ok', warns: 0, mealsToday: 3, syncAt: '20:58', health: 'low_intake_3d' },

function genLedger(p, i) {
  if (p.name === ME.nickname) return LEDGER.map(r => ({ date: r.date, steps: r.steps, A: r.A, I: r.I, D: r.D, S: r.S, S_before: r.S_before, check: r.check, provisional: r.provisional, substituted: r.substituted, floorApplied: r.floorApplied, health: r.health, revision: r.revision, bmr: r.bmr, meals: r.d === 8 ? TODAY_MEALS : null }));
  return DATES.map((date, k) => {
    const d = k + 1;
    let steps = Math.round(p.baseSteps * (0.86 + ((i * 7 + d * 13) % 9) / 32) / 10) * 10;
    if (p.spikeDay === d) steps = p.spikeSteps;
    if (p.zeroFrom && d >= p.zeroFrom) steps = 0;
    let sessions = [];
    const kc = [360 + ((i * 3 + d * 5) % 6) * 20, 640 + ((i * 5 + d * 7) % 8) * 25, 500 + ((i * 2 + d * 11) % 7) * 20];
    let meals = kc.map((k2, si) => ({ slot: ['breakfast', 'lunch', 'dinner'][si], status: 'confirmed', kcal: k2 }));
    if (p.mealScale) meals = meals.map(m => ({ ...m, kcal: Math.round(m.kcal * p.mealScale / 10) * 10 }));
    if (p.lowIntakeDays && p.lowIntakeDays.includes(d)) meals = meals.map(m => ({ ...m, kcal: Math.round(m.kcal * 0.55 / 10) * 10 }));
    if (d === 8) meals = meals.map((m, si) => si < p.mealsToday ? m : { slot: m.slot, status: 'empty' });
    if (p.name === WATCH_USER.nickname && d === 8) { steps = WATCH_ACTIVITY.stepsTotal; sessions = WATCH_ACTIVITY.sessions; meals = WATCH_MEALS; } // 예시 2와 동일(72.1)
    const r = ENGINE.simulate({ profile: p, stepsTotal: steps, sessions, meals });
    return { date, steps, sessions, A: r.act.A, I: r.inn.I, D: r.sc.D, S: r.sc.S, check: d <= CONST.CHECK_DAYS, provisional: d === 8, substituted: r.inn.substitutedSlots, floorApplied: r.sc.floorApplied, meals, bmr: r.bmr };
  });
}

function render() {
  CURRENT = parseHash();
  const key = CURRENT.id + '-' + CURRENT.variant;
  if (key !== LAST_KEY) { applyVariant(CURRENT); LAST_KEY = key; }
  draw();
}
function draw() {
  OVERLAY = '';
  const s = SCREENS[CURRENT.id];
  const html = s.render(CURRENT.variant);
  document.getElementById('view').innerHTML = html;
  document.getElementById('overlay').innerHTML = OVERLAY;
  drawChrome();
  const dlg = document.querySelector('#overlay [role="dialog"]');
  if (dlg) { const f = dlg.querySelector('input:not([disabled]), textarea, select, button:not([disabled])'); (f || dlg).focus({ preventScroll: true }); }
  document.body.style.overflow = OVERLAY ? 'hidden' : '';
  // 검토 상세 변형은 URL로 바로 열었을 때 상세(증거·판정 폼)가 보이도록 이동
  if (CURRENT.id === 'op3' && ['dry-run', 'decided', 'sla-warn', 'sla-critical'].includes(CURRENT.variant) && !DRAWN_ONCE[CURRENT.id + CURRENT.variant]) {
    DRAWN_ONCE[CURRENT.id + CURRENT.variant] = true; const h = document.querySelector('#view .h2'); if (h) h.scrollIntoView({ block: 'start' });
  }
}
const DRAWN_ONCE = {};
function drawChrome() {
  const s = SCREENS[CURRENT.id]; const pend = pendingCount(); const st = STATUS[topState()];
  document.getElementById('sidenav').innerHTML = `<div class="brand"><span class="logo">C</span><div><div class="t">챌로리 콘솔</div><div class="s">운영자 웹</div></div></div>
    <button class="item" data-nav="op0" ${CURRENT.id === 'op0' ? 'aria-current="page"' : ''}>${ms('dashboard')}<span><span class="id">OP0</span><span class="nm">챌린지 목록</span></span><span></span></button>
    <div class="lbl">${esc(CHALLENGE.name)}</div>
    ${ORDER.map(id => `<button class="item sub" data-nav="${id}" ${CURRENT.id === id ? 'aria-current="page"' : ''}>${ms(SCREENS[id].icon)}<span><span class="id">${id.toUpperCase()}</span><span class="nm">${esc(SCREENS[id].short || SCREENS[id].name)}</span></span>${id === 'op3' ? `<span class="badge ${pend ? '' : 'zero'}" aria-label="미결 ${pend}건">${pend}</span>` : '<span></span>'}</button>`).join('')}
    <div class="foot"><span class="av">민</span><span>운영자 민호 · 감사 로그 ON</span></div>`;
  document.getElementById('topbar').innerHTML = `<div class="cname">${esc(CHALLENGE.name)}<span class="code">${CHALLENGE.code}</span></div>
    <span class="pill ${st.kind}" role="status">${ms(st.icon)}${st.label}<small>${st.en}</small></span>
    <span class="dday">${ms('calendar_today', 'sm')}<b>${st.d[0]}</b><span>${st.d[1]}</span></span>
    <span class="grow"></span>
    <span class="sync">${ms('sync', 'xs')}데이터 기준 ${mdDate(CHALLENGE.today)} ${CHALLENGE.syncTime} · 매시 정각 재계산</span>`;
  document.getElementById('variants').innerHTML = Object.entries(s.variants).map(([k, label]) => `<button data-nav="${CURRENT.id}${k === 'default' ? '' : '-' + k}" aria-pressed="${k === CURRENT.variant}">${esc(label)}</button>`).join('');
  document.getElementById('hashcode').textContent = location.hash || '#op1';
  document.title = `${CURRENT.id.toUpperCase()} ${s.name} · 챌로리 운영자 콘솔`;
}

/* ======================= 인터랙션 ======================= */
let toastTimer;
function toast(msg, icon = 'check_circle') {
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = `${ms(icon)}<span>${esc(msg)}</span>`; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2400);
}
function closeOverlay() {
  const v = CURRENT.variant;
  if (['transition', 'drawer', 'action', 'confirm'].includes(v)) navigate(CURRENT.id); else { OVERLAY = ''; document.getElementById('overlay').innerHTML = ''; document.body.style.overflow = ''; }
}
function redrawForm() {
  const item = QUEUE.find(q => q.id === OP3.sel); const el = document.getElementById('verdictForm'); if (!el) return;
  el.outerHTML = verdictForm(item);
}
async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch (_) { toast(msg + ' (클립보드 권한 없음 · 프로토타입)', 'content_copy'); } }

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]'); if (navBtn) { if (navBtn.getAttribute('aria-disabled') === 'true') return; navigate(navBtn.dataset.nav); return; }
  const themeBtn = e.target.closest('#themeCtrl button'); if (themeBtn) { setTheme(themeBtn.dataset.theme); return; }
  const closeEl = e.target.closest('[data-close]');
  if (closeEl && (closeEl === e.target || closeEl.tagName === 'BUTTON')) { closeOverlay(); return; }
  const dr = e.target.closest('[data-drawer]'); if (dr) { OP2.drawerWho = dr.dataset.drawer; OP2.menu = null; navigate('op2-drawer'); return; }
  const flt = e.target.closest('[data-filter]'); if (flt) { OP2.filter = flt.dataset.filter; OP2.menu = null; draw(); return; }
  const menuBtn = e.target.closest('[data-menu]'); if (menuBtn) { OP2.menu = OP2.menu === menuBtn.dataset.menu ? null : menuBtn.dataset.menu; draw(); if (OP2.menu) { const m = document.querySelector('.menu button'); if (m) m.focus(); } return; }
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const type = actionEl.dataset.action, who = actionEl.dataset.who; OP2.menu = null;
    if (type === 'memo') { OP2.drawerWho = who; navigate('op2-drawer'); setTimeout(() => { const m = document.getElementById('memoInput'); if (m) m.focus(); }, 50); return; }
    OP2.action = { type, who }; navigate('op2-action'); return;
  }
  if (!e.target.closest('.menu-wrap') && OP2.menu) { OP2.menu = null; draw(); }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'md-reset') { OP1.md = DEFAULT_MD; draw(); return; }
  if (a === 'md-save') { toast('규칙을 게시했어요 · P11에 바로 반영 · 감사 로그 기록'); return; }
  if (a === 'copy-link') { copyText(`https://challory.app/j/${CHALLENGE.code}`, '초대 링크를 복사했어요'); return; }
  if (a === 'kakao-text') { OP1.kakaoOpen = !OP1.kakaoOpen; draw(); if (OP1.kakaoOpen) { const t = document.getElementById('kakaoText'); if (t) t.focus(); } return; }
  if (a === 'copy-kakao') { const t = document.getElementById('kakaoText'); copyText(t ? t.value : '', '공유 문구를 복사했어요'); return; }
  if (a === 'do-recruit') { OP1.recruiting = true; navigate('op1'); toast('모집을 시작했어요 · 초대코드 활성화 · 감사 로그 기록', 'campaign'); return; }
  if (a === 'back-draft') { OP1.recruiting = false; draw(); toast('초안으로 되돌렸어요 · 초대코드 비활성'); return; }
  if (a === 'cancel-ch') { toast('취소는 프로토타입에서 생략 · 참가자 공지(N-03) + 사진 즉시 파기', 'info'); return; }
  if (a === 'send-diag') { toast('P4 연결 진단 안내를 보냈어요 · 당사자에게만', 'send'); return; }
  if (a === 'save-memo') { const m = document.getElementById('memoInput'); OP2.memo[act.dataset.who] = m ? m.value : ''; toast('메모를 저장했어요 · 감사 로그 기록'); return; }
  if (a === 'open-review') { const q = QUEUE.find(x => x.who === act.dataset.who); if (q) { selectQueue(q.id); OP3.keepSel = true; } navigate('op3'); return; }
  if (a === 'confirm-action') {
    const { type, who } = OP2.action; const p = person(who);
    if (type === 'exclude') p.status = 'excluded'; if (type === 'kick') p.status = 'kicked'; if (type === 'block') p.blocked = true;
    const msg = ACTION_TEXT[type].toast; OP2.action = null; navigate('op2'); toast(msg); return;
  }
  if (a === 'sort') { toast('정렬은 프로토타입에서 생략 · 열 헤더 클릭으로 정렬', 'swap_vert'); return; }
  if (a === 'sel-queue') { selectQueue(act.dataset.id); draw(); const h = document.querySelector('.h2'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a === 'show-done') { toast('완료 12건 목록은 프로토타입에서 생략', 'info'); return; }
  if (a === 'confirm-verdict') {
    if (act.disabled) return;
    OP3.decided[OP3.sel] = { verdict: OP3.verdict, tpl: OP3.tpl, at: '10.13 21:14', by: '민호' }; OP3.lastDecided = OP3.sel;
    const q = QUEUE.find(x => x.id === OP3.sel); const p = person(q.who);
    if (OP3.verdict === 'warn') p.warns = Math.min(3, p.warns + 1);
    if (OP3.verdict === 'exclude' || (OP3.verdict === 'warn' && p.warns >= 3)) p.status = 'excluded';
    else if (p.status === 'review' && !QUEUE.some(x => x.who === q.who && !OP3.decided[x.id])) p.status = 'ok';
    navigate('op3-decided'); toast('판정을 저장했어요 · N-06 발송 · 감사 로그 기록', 'gavel'); return;
  }
  if (a === 'notice-preview') { OP4.noticePreview = true; draw(); const pv = document.getElementById('noticePreview'); if (pv) pv.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
  if (a === 'notice-send') { if (act.disabled) return; OP4.sent = true; draw(); toast(`${CHALLENGE.joined}명에게 보냈어요 · N-03 · P5 배너·P12 공지 목록에 보관`, 'send'); return; }
  if (a === 'csv') { OP4.csv[act.dataset.csv] = makeCsv(act.dataset.csv); draw(); toast(`${CSVS[act.dataset.csv].label} CSV를 생성했어요 · 건강 신호 미포함`, 'download_done'); return; }
  if (a === 'final-go') { if (act.disabled) return; navigate('op4-published'); toast(`결과를 확정했어요 · ${CHALLENGE.joined}명에게 발표 · 이의 기간 ~${CHALLENGE.objectionUntil}`, 'verified'); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'verdict') { OP3.verdict = e.target.value; OP3.previewed = true; redrawForm(); const r = document.querySelector(`input[name="verdict"][value="${OP3.verdict}"]`); if (r) r.focus({ preventScroll: true }); return; }
  if (e.target.id === 'tplSel') { OP3.tpl = e.target.value; redrawForm(); const s = document.getElementById('tplSel'); if (s) s.focus({ preventScroll: true }); return; }
  if (e.target.id === 'finalChk') { OP4.finalChk = e.target.checked; const b = document.getElementById('finalGo'); if (b) b.disabled = !e.target.checked; return; }
  if (e.target.id === 'destroyChk') { const b = document.getElementById('destroyBtn'); if (b) b.disabled = !e.target.checked; return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'mdInput') { OP1.md = e.target.value.slice(0, 2000); const pv = document.getElementById('p11preview'); if (pv) pv.innerHTML = p11Preview(OP1.md); const c = document.getElementById('mdCount'); if (c) c.textContent = `${OP1.md.length} / 2,000`; return; }
  if (e.target.id === 'nTitle') { OP4.title = e.target.value; const c = document.getElementById('nTitleCount'); if (c) { c.textContent = `${OP4.title.length} / 40`; c.classList.toggle('over', OP4.title.length > 40); } return; }
  if (e.target.id === 'nBody') { OP4.body = e.target.value; const c = document.getElementById('nBodyCount'); if (c) { c.textContent = `${OP4.body.length} / 500`; c.classList.toggle('over', OP4.body.length > 500); } return; }
});
document.addEventListener('toggle', (e) => { if (e.target.id === 'healthSec') OP2.healthOpen = e.target.open; }, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (OP2.menu) { OP2.menu = null; draw(); return; } if (document.querySelector('#overlay [role="dialog"]')) closeOverlay(); }
});
function setTheme(mode) {
  if (mode === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('#themeCtrl button').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === mode));
  try { localStorage.setItem('challory-theme', mode); } catch (_) {}
}
try { const saved = localStorage.getItem('challory-theme'); if (saved && saved !== 'system') setTheme(saved); } catch (_) {}
window.showScreen = (hash) => navigate(String(hash).replace(/^#/, '')); // 스크린샷 도구용
window.addEventListener('hashchange', render);
render();
</script>
