name: challory
description: "챌로리(Challory) 참가자 앱 — 다이어트 챌린지"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_riverpod: ^3.0.0
  supabase_flutter: ^2.10.0
  health: ^13.0.0
  camera: ^0.11.0
  intl: ^0.20.2
  image: ^4.10.1
  crypto: ^3.0.7
  sign_in_with_apple: ^8.2.0
  kakao_flutter_sdk_user: ^2.0.1
  path_provider: ^2.1.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Pretendard.txt
    - assets/fonts/OFL-BarlowSemiCondensed.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed_500Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed_700Bold.ttf
          weight: 700
